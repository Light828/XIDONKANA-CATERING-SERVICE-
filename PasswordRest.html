<!DOCTYEP html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title> Forgot Password</title>
	<style>
		body{margin:0;
			padding:0;
		font-family:Arial, sana-serif;
		background-image:url('MNISI1.jpg');
		background-position:center;
		background-repeat:no-repeat;
		background-size:cover;
		height:100vh;
		width:100vw;
		text-align:center;}
		
		.container{width:300px;
					margin:100px auto;
					padding:20px;
					background:white;
					box-shadow:0px 0px 10px rgba(0,0,0,0.1);
					border-radius:5px;
					}
					
		input{width:100%;
			  padding:10px;
			  margin:5px 0;
			  border:1px solid #ccc;
			  border-radius:3px;
			  }
			  
		.reset-btn{
					background-color:#1877f2;
					color:white;
					padding:10px;
					border:none;
					width:100%;
					cursor:pointer;
					border-radius:3px;}
					
		.Home-btn{
					background-color:#1877f2;
					color:white;
					padding:10px;
					border:none;
					width:100%;
					cursor:pointer;
					border-radius:3px;}
	</style>
	<script>
		function validate(){
			var input=document.getElementById("email").value;
			if(input=== "Light@2" || input=== "light@2"){
				window.location.replace("Continue.html");
			}
			else{
				document.getElementById("message").innerHTML="Invalid Email entered!";
				document.getElementById("message").style.color="red";
			}
		}
		function BackPage(){
			window.location.replace("index.html");
		}
	</script>
</head>
<body>
	<div class="container">
		<h1> Find your account</h1>
		<h2>Forgot Password?</h2>
		<h3>Enter your email to rest your password</h3>
		<h4>
		Username=Light@2/light@2
		Password=Mnisi
	</h4>
		<form>
			<input type="email" id="email" placeholder="Email address" required><br><br>
			<button onclick="validate()" type="button" class="reset-btn">Continue</button><br><br>
			<button onclick="BackPage()" type="button" class="Home-btn">Back</button>
			<p id="message"></p>
		</form>
	</div>
</body>
</html>
