<!DOCTYEP html>
<html>
<head>

<title> Continue </title>
<style>
	body{margin:0;
			padding:0;
		font-family:Arial, sana-serif;
		background-image:url('Xidonkana .png');
		background-position:center;
		background-repeat:no-repeat;
		background-size:cover;
		height:100vh;
		width:100vw;
		text-align:center;}
		
		
	.container{width:300px;
					margin:100px auto;
					padding:20px;
					background:white;
					box-shadow:0px 0px 10px rgba(0,0,0,0.1);
					border-radius:5px;
					}
					
	input{width:100%;
			  padding:10px;
			  margin:5px 0;
			  border:1px solid #ccc;
			  border-radius:3px;
			  }
			  
	.new-btn{
					background-color:#1877f2;
					color:white;
					padding:10px;
					border:none;
					width:100%;
					cursor:pointer;
					border-radius:3px;}
					
	.HomePage-btn{
					background-color:#1877f2;
					color:white;
					padding:10px;
					border:none;
					width:100%;
					cursor:pointer;
					border-radius:3px;}
</style>

	<script>
		function validate(){
			var Password1=document.getElementById("Password1").value;
			var Password2=document.getElementById("Password2").value;
			
			if(Password1=== Password2){
			    document.getElementById("message").innerHTML="Password successfully changed";
				document.getElementById("message").style.color="green";
				
			}
			else{
				document.getElementById("message").innerHTML="Password do not match";
				document.getElementById("message").style.color="red";
			}
		}
		function HomePage(){
			window.location.replace("XIDONKANA.html");
		}
		
	</script>
</head>

<body>
<div class="container">
	<h1>Reset Your Password</h1>
	<h3>Strong passwords include numbers,letters and punctuation Marks.</h3>
	<form>
		<label for="Password1"> Enter new password</label><br>
		<input type="password" id="Password1" required><br><br>
		<label for="Password2"> Confirm new password</label><br>
		<input type="password" id="Password2" required><br><br>
		<button  onclick="validate()" type="button" class="new-btn">Reset Password</button><br><br>
		<button  onclick="HomePage()" type="button" class="HomePage-btn">Home Page</button>
		<p id="message"></p>
	</form>
</div>

</body>

</html>
