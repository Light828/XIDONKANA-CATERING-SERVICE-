<DOCTYPE html>
<html lang="en">
<head> 
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> XIDONKANA</title>
	
	<style>
		
		body{margin:0;
			padding:0;
		font-family:Arial, sana-serif;
		background-image:url('MNISI1.jpg');
		background-position:center;
		background-repeat:no-repeat;
		background-size:cover;
		height:100vh;
		width:100vw;
		text-align:center;}
		
		.container{width:300px;
					margin:100px auto;
					padding:20px;
					background:white;
					box-shadow:0px 0px 10px rgba(0,0,0,0.1);
					border-radius:5px;
					}
		
		input{width:100%;
			  padding:10px;
			  margin:5px 0;
			  border:1px solid #ccc;
			  border-radius:3px;
			  }
		.login-btn{
					background-color:#1877f2;
					color:white;
					padding:10px;
					border:none;
					width:100%;
					cursor:pointer;
					border-radius:3px;}
					
		.forgot{
				display:block;
				margin-top:10px;
				color:#1877f2;
				text-decoration:none;
		}
		.createAccount-btn{background-color:#1877f2;
					color:white;
					padding:10px;
					border:none;
					width:100%;
					cursor:pointer;
					border-radius:3px;}
	</style>
	
		<script>
		function validate(){
			var input=document.getElementById("email").value;
			var password=document.getElementById("password").value;
			if(input=== "Light@2" || input=== "light@2"){
				if(password==="Mnisi"){
					window.location.replace("Login.html");
					}
				else{
					document.getElementById("message").innerHTML="Invalid Password Entered!";
					document.getElementById("message").style.color="red";
				}
			}
			else{
				document.getElementById("message").innerHTML="Invalid Email Entered!";
				document.getElementById("message").style.color="red";
			}
		}
		function next(){
			window.location.replace("NewAccount.html");
		}
	</script>
	

</head>
<body>
<div class="container">
<h1>XIDONKANA CATERING SERVICE</h1>
<h3> Welcome to XIDONKANA CATERING SERVICE here we offer one of the best chef courses and catering service</h3>
<form >
     
	 <input type="users_email" id="email"  placeholder="Mobile number or Email" ><br><br>
	 <input type="password" id="password" placeholder="Password" ><br><br>
	 <button onclick="validate()" type="button" class="login-btn">Login</button> <br><br>
	 <a href="PasswordRest.html" class="forgot">Forgot password?</a> <br><br><br>
	 <button onclick="next()" type="button" class="createAccount-btn">Create new account</button> <br><br>
	 <p id="message"></p>
</form>
</div>

</body>
</html>
